name: arman-pakhsh

services:
  web:
    image: node:22
    working_dir: /app
    labels:
      base44.project: Arman Pakhsh
      base44.kind: web
      base44.port: 3000
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Platform-supplied sandbox values. Passing the names bare keeps the
      # platform's values (and their absence outside the sandbox) intact.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - CI=true
      - CHOKIDAR_USEPOLLING=true
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
